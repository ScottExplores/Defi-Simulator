<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeWell</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              background: '#09090b', // zinc-950
              surface: '#18181b', // zinc-900
              surfaceHighlight: '#27272a', // zinc-800
              primary: '#3b82f6', // blue-500
              success: '#10b981', // emerald-500
              warning: '#f59e0b', // amber-500
              danger: '#ef4444', // red-500
              textMain: '#f4f4f5', // zinc-100
              textMuted: '#a1a1aa', // zinc-400
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
            },
            animation: {
              float1: "float1 20s infinite ease-in-out alternate",
              float2: "float2 25s infinite ease-in-out alternate",
              float3: "float3 28s infinite ease-in-out alternate",
            },
            keyframes: {
              float1: {
                "0%": { transform: "translate(0, 0) scale(1)", opacity: "0.3" },
                "33%": { transform: "translate(30vw, -10vh) scale(1.4)", opacity: "0.6" },
                "66%": { transform: "translate(10vw, 20vh) scale(0.8)", opacity: "0.2" },
                "100%": { transform: "translate(0, 0) scale(1)", opacity: "0.3" },
              },
              float2: {
                "0%": { transform: "translate(0, 0) scale(1)", opacity: "0.4" },
                "50%": { transform: "translate(-25vw, 30vh) scale(0.7)", opacity: "0.1" },
                "100%": { transform: "translate(-10vw, -10vh) scale(1.2)", opacity: "0.4" },
              },
              float3: {
                "0%": { transform: "translate(0, 0) scale(1)", opacity: "0.2" },
                "50%": { transform: "translate(20vw, 30vh) scale(1.5)", opacity: "0.5" },
                "100%": { transform: "translate(-20vw, -20vh) scale(0.9)", opacity: "0.2" },
              },
            },
          },
        },
      };
    </script>
    <style>
      body {
        background-color: #09090b;
        color: #f4f4f5;
      }
      /* Custom scrollbar for tables */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #18181b;
      }
      ::-webkit-scrollbar-thumb {
        background: #3f3f46;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #52525b;
      }
    </style>
